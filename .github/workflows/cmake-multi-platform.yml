# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        ci_configure_presets: [ci-ubuntu, ci-windows]
        ci_build_presets: [ci-ubuntu-release, ci-windows-release]
        ci_test_presets: [ci-ubuntu-test-release, ci-windows-test-release]
        ci_pack_presets: [ci-ubuntu-package, ci-windows-package]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            ci_configure_presets: ci-windows
            ci_build_presets: ci-windows-release
            ci_test_presets: ci-windows-test-release
            ci_pack_presets: ci-windows-package
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            ci_configure_presets: ci-ubuntu
            ci_build_presets: ci-ubuntu-release
            ci_test_presets: ci-ubuntu-test-release
            ci_pack_presets: ci-ubuntu-package
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            ci_configure_presets: ci-ubuntu
            ci_build_presets: ci-ubuntu-release
            ci_test_presets: ci-ubuntu-test-release
            ci_pack_presets: ci-ubuntu-package
        exclude:
          - os: windows-latest
            c_compiler: gcc
            ci_configure_presets: ci-ubuntu
            ci_build_presets: ci-ubuntu-release
            ci_test_presets: ci-ubuntu-test-release
            ci_pack_presets: ci-ubuntu-package
          - os: windows-latest
            c_compiler: clang
            ci_configure_presets: ci-ubuntu
            ci_build_presets: ci-ubuntu-release
            ci_test_presets: ci-ubuntu-test-release
            ci_pack_presets: ci-ubuntu-package
          - os: ubuntu-latest
            c_compiler: cl
            ci_configure_presets: ci-windows
            ci_build_presets: ci-windows-release
            ci_test_presets: ci-windows-test-release
            ci_pack_presets: ci-windows-package

    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: >
        cmake --preset ${{ matrix.ci_configure_presets }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}

    - name: Build
      run: cmake --build --preset ${{ matrix.ci_build_presets }}

    - name: Test
      run: ctest --preset ${{ matrix.ci_test_presets }}

    - name: Package
      run: cpack --preset ${{ matrix.ci_pack_presets }}
      
